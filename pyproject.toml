[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "B"]
ignore = ["E501", "B008", "N815"]

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "reportlab.*",
    "svglib.*",
    "PIL.*",
    "cssselect2.*",
    "tinycss2.*",
    "yaml.*",
    "structlog.*",
    "pytest_bdd.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
norecursedirs = ["mutants", ".mutmut-cache", ".venv", "venv"]
asyncio_mode = "strict"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=85 --cov-branch"

[tool.mutmut]
source_paths = ["src/domain/pricing/"]
runner = "../venv/bin/python -m pytest -o pythonpath=src:. --no-cov tests/pricing"


















